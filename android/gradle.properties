# 2 GB y no 8: el AOT de Dart es un proceso APARTE de la JVM de Gradle.
# Con -Xmx8G -XX:MaxMetaspaceSize=4G, Gradle se reservaba la máquina y el
# compilador AOT moría con "zone.cc: Out of memory" al armar el AAB de
# release (exit -1073740791). Pasó compilando la 1.0.0+2 en una máquina de
# 8/16 GB. Gradle no necesita tanto: lo que necesita RAM es Dart.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
