name: rutalibre
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  supabase_flutter: ^2.16.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  go_router: ^17.3.0
  fpdart: ^1.2.0
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  geolocator: ^14.0.3
  share_plus: ^13.3.0
  http: ^1.6.0
  # Vuelve, y esta vez por algo que solo se puede hacer afuera de la app:
  # abrir el nodo de la parada en OpenStreetMap para corregirlo. (Se había
  # sacado al quitar el botón del 911, que era su único uso.)
  url_launcher: ^6.3.2
  # El cartel para el chofer sube el brillo al máximo mientras está abierto:
  # su única función es verse desde un colectivo que viene con las luces
  # puestas, y un cartel al 30% de brillo no es un cartel.
  screen_brightness: ^2.1.0
  # La alarma "avisame para bajar": la pantalla que no se apaga mientras
  # está armada — una alarma en una pantalla apagada no despierta a nadie
  # (la versión con la app cerrada pide un servicio en primer plano y queda
  # para la 1.1). El TONO de la alarma no usa plugin: es un canal nativo
  # propio de veinte líneas (ver MainActivity.kt y wake_alarm.dart).
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Mocks en runtime, SIN codegen (respeta la regla "sin build_runner" de
  # ARCHITECTURE.md). Solo para tests.
  mocktail: ^1.0.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Las paradas de Corrientes capital. Ver tools/corrientes_stops_import.dart
    # para por qué van acá y no en la base.
    - assets/corrientes_stops.json
    # Los lugares (hospitales, escuelas, plazas…) y las calles del buscador
    # de destino. Se generan con `dart run tools/places_import.dart` y se
    # leen RECIÉN al abrir el buscador, nunca en el arranque.
    - assets/places.json
    # Las alturas (números de puerta por calle, de OSM). El asset más pesado
    # de la app, y por eso va aparte: se carga solo cuando alguien escribe
    # una altura ("San Juan 5240") — quien nunca lo hace, nunca lo paga.
    - assets/addresses.json

  fonts:
    # Inter, en su versión VARIABLE: un solo archivo con todos los pesos.
    #
    # Se empaqueta en vez de usar `google_fonts` porque ese paquete la baja
    # por red la primera vez, y hasta que llega la app se ve con la fuente del
    # sistema. Una app que promete abrir sin señal no puede depender de eso.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ---------------------------------------------------------------------------
# Ícono y splash
#
# Los PNG de acá abajo NO se declaran como assets de Flutter a propósito: los
# leen los generadores EN TIEMPO DE BUILD, la app nunca los abre (dibuja la
# marca en código, ver lib/app/theme/brand.dart). Declararlos metería tres
# imágenes de 1024 px en el bundle para nada.
#
# Se generan desde el painter de la marca, así que no pueden divergir de ella:
#   flutter test test/brand/brand_assets_test.dart
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: true
  ios: true
  # iOS rechaza íconos con canal alfa. El nuestro es opaco igual (fondo
  # negro a sangre), pero dejarlo explícito evita un rechazo en la subida.
  remove_alpha_ios: true
  # Ícono adaptable: Android compone fondo + frente y les aplica la máscara
  # de cada launcher (círculo, squircle, gota).
  adaptive_icon_background: "#161616"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  # Íconos temáticos de Android 13+: el launcher pinta esta capa con el color
  # del fondo de pantalla. Se declara acá y no se agrega a mano al XML porque
  # regenerar los íconos reescribe ese archivo y se perdería en silencio.
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#161616"
  image: assets/branding/splash.png
  # Android 12+ ignora el splash clásico y usa el suyo, que recorta a un
  # círculo: por eso el mismo dibujo con harta zona segura.
  android_12:
    color: "#161616"
    image: assets/branding/splash.png
    icon_background_color: "#161616"
